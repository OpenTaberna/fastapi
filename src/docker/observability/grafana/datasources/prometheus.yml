apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned, not left to Grafana. Without an explicit uid Grafana generates a
    # random one on first provision, and every panel in the dashboard — which
    # references `prometheus` — resolves to a datasource that does not exist and
    # renders "No data". The dashboard and the datasource are provisioned
    # separately, so the only thing tying them together is this string.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://opentaberna-prometheus:9090
    isDefault: true
    editable: false
