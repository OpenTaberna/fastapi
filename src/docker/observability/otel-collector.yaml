# OpenTelemetry Collector — the seam between the application and wherever
# telemetry ends up.
#
# The API speaks OTLP and knows nothing else. Swapping Prometheus and Grafana
# for a vendor is a change to this file, not to any application code.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Bounds memory so a burst of spans cannot push the collector into the OOM
  # killer and take the metrics pipeline down with it.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Prometheus scrapes this endpoint rather than the API directly, so the API
  # never has to expose a metrics port of its own.
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: warn
    metrics:
      # The collector's own health. Without this the scrape target Prometheus
      # is configured for refuses connections, and "is the collector coping?"
      # has no answer.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
