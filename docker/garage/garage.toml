# Single-node Garage for local development and CI. Not a production config:
# one copy of every object, no redundancy.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# The API's boto client signs for us-east-1 by default; Garage rejects
# requests signed for any region other than this one.
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
